[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simp"
version = "0.1.0"
description = "Simulated Investment Manager Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "wrds",
]

[project.optional-dependencies]
jupyter = [
    "jupyter",
    "ipykernel",
]
dev = [
    "pytest",
]

[tool.setuptools]
packages = []
